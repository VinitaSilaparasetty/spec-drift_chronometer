[project]
name = "spec-drift-chronometer"
version = "0.1.0"
description = "Open, vendor-neutral oversight gate for AI agents: drift detection, justification gate, audit log"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "mangum>=0.21.0",
    "uvicorn",
]

[tool.uv.workspace]
members = ["backend"]

[project.scripts]
chronometer = "backend.main:main"

[tool.hatch.build.targets.wheel]
# This tells Hatchling: "Don't look for a folder matching the project name,
# just include the backend folder."
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
